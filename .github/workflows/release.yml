name: release

# Build the ShadowBound toolchain Docker image, publish it to GHCR, and cut a
# GitHub Release with the toolchain and FFmalloc artifacts. Triggered by a
# version tag (e.g. v1.1.0) or manually.
on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write   # create releases
  packages: write   # push to GHCR

jobs:
  image:
    runs-on: ubuntu-22.04
    timeout-minutes: 350
    outputs:
      image: ${{ steps.meta.outputs.image }}
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: false

      - name: Lowercase image name
        id: meta
        run: echo "image=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/shadowbound" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push toolchain image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile
          push: true
          tags: |
            ${{ steps.meta.outputs.image }}:${{ github.ref_name }}
            ${{ steps.meta.outputs.image }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

  release:
    needs: image
    runs-on: ubuntu-22.04
    if: startsWith(github.ref, 'refs/tags/')
    steps:
      - uses: actions/checkout@v4

      - name: Package FFmalloc libraries from the image
        run: |
          img="${{ needs.image.outputs.image }}:${{ github.ref_name }}"
          docker pull "$img"
          cid=$(docker create "$img")
          mkdir -p dist
          docker cp "$cid":/shadowbound/ffmalloc dist/ffmalloc || true
          docker rm "$cid"
          tar -C dist -czf shadowbound-ffmalloc-${{ github.ref_name }}.tar.gz ffmalloc || true

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          body: |
            ShadowBound ${{ github.ref_name }}.

            Toolchain image: `${{ needs.image.outputs.image }}:${{ github.ref_name }}`

            ```
            docker pull ${{ needs.image.outputs.image }}:${{ github.ref_name }}
            ```
          files: |
            shadowbound-ffmalloc-*.tar.gz
