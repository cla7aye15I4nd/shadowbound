name: artifact-availability

# Guarantee the main experiment stays runnable ("available"). Builds the
# toolchain base image, then builds and smoke-tests the Nginx artifact image. Heavy (full toolchain build); runs on artifact/toolchain
# changes and on demand, with Docker layer caching.
on:
  push:
    branches: [main, shadowbound-artifact-release]
    paths:
      - 'artifact/nginx/**'
      - 'Dockerfile'
      - '.github/workflows/artifact-availability.yml'
  pull_request:
    paths:
      - 'artifact/nginx/**'
      - 'Dockerfile'
      - '.github/workflows/artifact-availability.yml'
  workflow_dispatch:

jobs:
  nginx:
    runs-on: ubuntu-26.04
    timeout-minutes: 350
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3

      - name: Build toolchain base image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile
          load: true
          tags: shadowbound-base:ci
          cache-from: type=gha,scope=base
          cache-to: type=gha,scope=base,mode=max

      # Plain `docker build`: the buildx builder above (docker-container
      # driver) cannot see the base image that was loaded into the local
      # daemon, and tries to pull shadowbound-base:ci from Docker Hub.
      - name: Build Nginx artifact image
        run: |
          docker build -f artifact/nginx/Dockerfile \
            --build-arg BASE_IMAGE=shadowbound-base:ci \
            -t shadowbound-nginx:ci .

      - name: Disable ASLR (fixed shadow/allocator mappings)
        run: sudo sysctl -w kernel.randomize_va_space=0

      - name: Smoke-test each Nginx build
        run: |
          for t in native shadowbound shadowbound-ffmalloc shadowbound-markus; do
            echo "::group::nginx $t"
            docker run --rm --privileged -e TARGET="$t" shadowbound-nginx:ci /root/smoke.sh
            echo "::endgroup::"
          done
