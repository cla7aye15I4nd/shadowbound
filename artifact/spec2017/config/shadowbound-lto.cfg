# ShadowBound with link-time instrumentation (-flto).
#
# Same setup as shadowbound.cfg, but every benchmark is built with -flto and
# linked with lld: the checks are inserted at link time on the merged module,
# where the interprocedural non-heap analysis (shadowbound-ipo) sees every
# caller. This replaces the per-benchmark pattern files that analyzer/ produced
# (config/*.json, -shadowbound-pattern-opt-file). -mllvm -shadowbound-* options
# on the compiler/linker line are forwarded to the link-time instrumentation.

%ifndef %{label}
%  define label "shadowbound-lto"
%endif

%ifndef %{build_ncpus}
%   define  build_ncpus 8
%endif

command_add_redirect = 1
flagsurl             = $[top]/config/flags/clang.xml
ignore_errors        = 1
iterations           = 1
label                = %{label}
line_width           = 1020
log_line_width       = 1020
makeflags            = --jobs=%{build_ncpus}
mean_anyway          = 1
output_format        = txt,csv
preenv               = 1
reportable           = 0
tune                 = peak

intrate,fprate:
   copies           = 1
intspeed,fpspeed:
   threads          = 1

default:
   CC                      = /shadowbound/llvm-project/build/bin/clang   -std=c99    -fsanitize=shadowbound -flto -fuse-ld=lld -mllvm -shadowbound-whitelist=/root/cpu2017/whitelist.txt
   CXX                     = /shadowbound/llvm-project/build/bin/clang++ -std=c++03  -fsanitize=shadowbound -flto -fuse-ld=lld -mllvm -shadowbound-whitelist=/root/cpu2017/whitelist.txt

   CC_VERSION_OPTION       = --version
   CXX_VERSION_OPTION      = --version

default:
   sw_base_ptrsize = 64-bit
   sw_peak_ptrsize = 64-bit

any_fortran:
   fail_build = 1

default:
   EXTRA_PORTABILITY = -DSPEC_LP64

500.perlbench_r,600.perlbench_s:
%if %{bits} == 32
%   define suffix IA32
%else
%   define suffix X64
%endif
   PORTABILITY   = -DSPEC_LINUX_%{suffix} 
   EXTRA_CFLAGS  = -mllvm -shadowbound-perf-test=1
   EXTRA_LDFLAGS = -mllvm -shadowbound-perf-test=1

502.gcc_r,602.gcc_s:
   EXTRA_CFLAGS = -fno-strict-aliasing -fgnu89-inline -mllvm -shadowbound-perf-test=1
   EXTRA_LDFLAGS = -mllvm -shadowbound-perf-test=1

508.namd_r:
   EXTRA_CXXFLAGS = -mllvm -shadowbound-perf-test=1
   EXTRA_LDFLAGS = -mllvm -shadowbound-perf-test=1

510.parest_r:
   CXXPORTABILITY    = -DSPEC_PAREST_STD_FLUSH_WORKAROUND=1 
   EXTRA_CXXFLAGS = -mllvm -shadowbound-perf-test=1
   EXTRA_LDFLAGS = -mllvm -shadowbound-perf-test=1

523.xalancbmk_r,623.xalancbmk_s:
   CXXPORTABILITY  = -DSPEC_LINUX 
   EXTRA_CXXFLAGS = -mllvm -shadowbound-perf-test=1
   EXTRA_LDFLAGS = -mllvm -shadowbound-perf-test=1

525.x264_r,625.x264_s:
   PORTABILITY    = -fcommon 

526.blender_r:
   PORTABILITY    = -funsigned-char -DSPEC_LINUX
   CXXPORTABILITY = -D__BOOL_DEFINED 

538.imagick_r,638.imagick_s:
   # Avoids an out-of-bounds pointer in the source; see
   # artifact/spec2017/src.alt/README.md.
   srcalt = shadowbound

default=base:
   OPTIMIZE       = -g -O1 -fno-slp-vectorize

default=peak:
   OPTIMIZE       = -g -O1 -fno-slp-vectorize

default:
   sw_compiler001   = Clang 15
